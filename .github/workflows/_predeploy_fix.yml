name: Prepare predeploy fix

on:
  push:
    branches:
      - chore/predeploy-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/predeploy-fix
          fetch-depth: 0
      - name: Apply requested fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pages/commande.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<p class="checkout-help">Le paiement en ligne sera ajouté ultérieurement. La validation enregistre votre commande. Pour un retrait, l’adresse exacte du point de retrait vous sera communiquée après validation.</p>', '<p class="checkout-help">La validation prépare votre paiement sécurisé Stripe. Votre commande ne sera confirmée qu’après paiement.</p>')
          start = text.index('          confirmation.hidden = false;')
          end_marker = '          summaryError.hidden = true;'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''          if (!data.checkoutUrl || typeof data.checkoutUrl !== "string") {
            const error = new Error("createPayment returned no checkoutUrl");
            error.code = "PAYMENT_CHECKOUT_URL_MISSING";
            throw error;
          }

          // createPayment prépare la tentative de paiement ; la commande n'est
          // confirmée qu'après paiement Stripe et retour vers confirmation.html.
          // Le panier reste volontairement intact jusqu'à ce moment.
          window.location.assign(data.checkoutUrl);'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('PAYMENT_ATTEMPT_NOT_FOUND: "La tentative de commande n’a pas pu être retrouvée.",', 'PAYMENT_ATTEMPT_NOT_FOUND: "La tentative de commande n’a pas pu être retrouvée.",\n          PAYMENT_CHECKOUT_URL_MISSING: "Le paiement sécurisé n’a pas pu être préparé. Veuillez réessayer.",')
          path.write_text(text, encoding='utf-8')
          Path('firebase.json').write_text('{\n  "functions": {\n    "source": "functions"\n  }\n}\n', encoding='utf-8')
          Path('.firebaserc').write_text('{\n  "projects": {\n    "default": "carnet-du-chef"\n  }\n}\n', encoding='utf-8')
          PY
          node --check functions/index.js
          node --check functions/createPayment.js
          node --check functions/order.js
          node --check functions/stripe.js
          python3 - <<'PY'
          import json
          for name in ('firebase.json', '.firebaserc'):
              with open(name, encoding='utf-8') as f:
                  json.load(f)
          PY
          git diff --check
          git add pages/commande.html firebase.json .firebaserc
          git commit -m "Fix Stripe checkout redirect and Firebase deployment config"
          git push origin HEAD:chore/predeploy-fix
          rm -f .github/workflows/_predeploy_fix.yml
          git add -u .github/workflows/_predeploy_fix.yml
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:chore/predeploy-fix
