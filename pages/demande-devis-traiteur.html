<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Demande de devis Traiteur — Le Carnet du Chef</title><link rel="icon" href="../favicon/favicon.ico" sizes="any"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/style.css"><style>.demande{max-width:900px;margin:auto}.demande-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.full{grid-column:1/-1}fieldset{border:0;padding:0;margin:0 0 2rem}legend{font-family:Fraunces,serif;font-size:1.5rem;margin-bottom:1rem}label{display:block;font-weight:600;margin-bottom:.35rem}input,select,textarea{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid rgba(35,52,42,.22);border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical}.check{display:flex;gap:.5rem;font-weight:400}.check input{width:auto}.status{margin:1rem 0;padding:1rem;border-radius:8px}.honeypot{position:absolute;left:-10000px}@media(max-width:700px){.demande-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main class="section">
  <div class="container demande">
    <div style="display:flex;justify-content:flex-end;margin-bottom:1rem;">
      <button type="button" onclick="history.back()" aria-label="Fermer le formulaire" style="border:0;background:none;font-size:1.8rem;line-height:1;cursor:pointer;padding:.25rem .5rem;">✕</button>
    </div><p class="eyebrow">Traiteur</p><h1>Demande de devis Traiteur</h1><p class="muted">Décrivez votre événement. Votre demande est sans engagement.</p><form data-demande-form="traiteur"><fieldset><legend>Votre projet</legend><div class="demande-grid"><div><label>Type de prestation *</label><select name="typePrestation" required><option value="">Sélectionner</option><option>Repas / prestation traiteur</option><option>Buffet</option><option>Cocktail</option><option>Événement professionnel</option><option>Événement particulier</option><option>Autre</option></select></div><div><label>Date de l'événement *</label><input name="dateEvenement" type="date" required></div><div><label>Heure *</label><input name="heure" type="time" required></div><div><label>Durée</label><input name="duree" placeholder="Ex. 3 heures"></div><div><label>Nombre de personnes *</label><input name="nombrePersonnes" type="number" min="1" required></div><div><label>Type de service *</label><select name="service" required><option value="">Sélectionner</option><option>Préparation et livraison</option><option>Préparation avec retrait</option><option>Prestation sur place</option><option>Buffet livré et installé</option><option>Autre</option></select></div><div class="full"><label>Description du projet *</label><textarea name="descriptionProjet" required></textarea></div><div class="full"><label>Plats, menus ou type de cuisine souhaité *</label><textarea name="demande" required></textarea></div><div class="full"><label>Préférences ou idées de menu</label><textarea name="preferencesMenu"></textarea></div><div><label>Budget indicatif</label><input name="budget"></div><div><label>Contraintes alimentaires</label><select name="contraintes"><option>Aucune</option><option>Allergies</option><option>Intolérances</option><option>Régime particulier</option><option>Autre</option></select></div><div class="full"><label>Précisions sur les contraintes</label><textarea name="precisionsContraintes"></textarea></div><div class="full"><label>Installation, matériel ou déroulement</label><textarea name="besoinsParticuliers"></textarea></div></div></fieldset><fieldset><legend>Lieu</legend><div class="demande-grid"><div class="full"><label>Adresse *</label><input name="adresse" required></div><div><label>Code postal *</label><input name="codePostal" required></div><div><label>Ville *</label><input name="ville" required></div></div></fieldset><fieldset><legend>Vos coordonnées</legend><div class="demande-grid"><div><label>Prénom *</label><input name="prenom" autocomplete="given-name" required></div><div><label>Nom *</label><input name="nom" autocomplete="family-name" required></div><div><label>Téléphone *</label><input name="telephone" autocomplete="tel" required></div><div><label>E-mail *</label><input name="email" type="email" autocomplete="email" required></div><div><label>Vous êtes *</label><select name="particulierProfessionnel" required><option value="">Sélectionner</option><option value="particulier">Particulier</option><option value="professionnel">Entreprise / Professionnel</option></select></div><div class="full"><label>Informations complémentaires</label><textarea name="informationsComplementaires"></textarea></div></div></fieldset><div class="honeypot"><input name="website" tabindex="-1" autocomplete="off"></div><label class="check"><input name="confirmation" type="checkbox" required> Je confirme avoir vérifié les informations saisies. Demande sans engagement. *</label><div data-demande-status class="status" hidden></div><p><button class="btn btn-primary" type="submit">Envoyer ma demande</button></p></form></div></main><script src="../js/config.js"></script><script src="../js/demandes.js"></script></body></html>
