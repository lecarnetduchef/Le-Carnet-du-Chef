<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation de paiement | Le Carnet du Chef</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="section">
    <div class="container" style="max-width:760px;text-align:center;">
      <p class="eyebrow">Le Carnet du Chef</p>
      <h1 id="title">Vérification de votre paiement</h1>
      <p id="message" class="muted">Nous vérifions la confirmation de votre paiement côté serveur.</p>
      <div id="result" class="notice" aria-live="polite">Vérification en cours…</div>
      <p><a class="btn btn-primary" href="commande.html">Retour au catalogue</a></p>
    </div>
  </main>
  <script>
    (() => {
      const result = document.querySelector("#result");
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const sessionId = params.get("session_id") || params.get("sessionId") || hashParams.get("session_id") || hashParams.get("sessionId");
      const endpoint = "https://europe-west9-carnet-du-chef.cloudfunctions.net/getPaymentStatus";

      if (!sessionId) {
        result.textContent = "Aucune session de paiement n’a été fournie.";
        return;
      }

      let attempts = 0;

      async function check() {
        attempts += 1;
        try {
          const response = await fetch(`${endpoint}?session_id=${encodeURIComponent(sessionId)}`);
          const data = await response.json();

          if (response.ok && data?.ok && data.status === "paid") {
            title.textContent = "Paiement confirmé ✅";
            message.textContent = data.type === "devis"
              ? "Votre paiement a bien été validé. Merci pour votre confiance et votre commande auprès du Carnet du Chef."
              : "Votre paiement a été confirmé par le serveur.";
            result.className = "notice success";
            result.textContent = data.type === "devis"
              ? "Votre facture vous sera automatiquement envoyée par e-mail."
              : data.numeroCommande ? `Commande ${data.numeroCommande}` : "Votre paiement est confirmé.";
            return;
          }

          if (attempts < 15) {
            result.textContent = "Paiement reçu par Stripe, confirmation serveur en cours…";
            window.setTimeout(check, 2000);
          } else {
            result.textContent = "Le paiement n’a pas encore pu être confirmé par notre serveur. Ne repassez pas un paiement : la confirmation peut nécessiter quelques instants.";
          }
        } catch (error) {
          if (attempts < 15) {
            window.setTimeout(check, 2000);
          } else {
            result.textContent = "La confirmation automatique est momentanément indisponible. Votre paiement reste traité côté serveur.";
          }
        }
      }

      check();
    })();
  </script>
</body>
</html>
