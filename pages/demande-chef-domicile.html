<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chef à domicile — Demande de prestation</title><link rel="icon" href="../favicon/favicon.ico" sizes="any"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/style.css"><style>.demande{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.full{grid-column:1/-1}fieldset{border:0;padding:0;margin:0 0 2rem}legend{font-family:Fraunces,serif;font-size:1.5rem;margin-bottom:1rem}label{display:block;font-weight:600;margin-bottom:.35rem}input,select,textarea{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid rgba(35,52,42,.22);border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical}.choices{display:grid;gap:.45rem}.choice,.check{display:flex;gap:.5rem;font-weight:400}.choice input,.check input{width:auto}.status{margin:1rem 0;padding:1rem;border-radius:8px}.honeypot{position:absolute;left:-10000px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main class="section"><div class="container demande"><p class="eyebrow">Chef à domicile</p><h1>Demande de prestation Chef à domicile</h1><p class="muted">Décrivez le repas que vous imaginez chez vous. Votre demande est sans engagement.</p><form data-demande-form="chef_domicile"><fieldset><legend>Votre projet</legend><div class="grid"><div><label>Type de prestation *</label><select name="typePrestation" required><option value="">Sélectionner</option><option>Repas privé</option><option>Repas en famille</option><option>Anniversaire</option><option>Repas romantique</option><option>Événement particulier</option><option>Autre</option></select></div><div><label>Date souhaitée *</label><input name="dateSouhaitee" type="date" required></div><div><label>Heure de début *</label><input name="heureDebut" type="time" required></div><div><label>Heure de fin *</label><input name="heureFin" type="time" required></div><div><label>Nombre de personnes *</label><input name="nombrePersonnes" type="number" min="1" required></div><div class="full"><label>Description du projet *</label><textarea name="descriptionProjet" required></textarea></div></div></fieldset><fieldset><legend>Le repas</legend><div class="grid"><div class="full"><label>Description du repas souhaité *</label><textarea name="descriptionRepas" required></textarea></div><div class="full"><label>Services souhaités</label><div class="choices"><label class="choice"><input type="checkbox" name="services" value="Apéritif"> Apéritif</label><label class="choice"><input type="checkbox" name="services" value="Entrée"> Entrée</label><label class="choice"><input type="checkbox" name="services" value="Plat"> Plat</label><label class="choice"><input type="checkbox" name="services" value="Dessert"> Dessert</label><label class="choice"><input type="checkbox" name="services" value="Autre"> Autre</label></div></div><div class="full"><label>Ordre ou composition</label><textarea name="ordreComposition"></textarea></div></div></fieldset><fieldset><legend>Préférences alimentaires</legend><div class="grid"><div><label>Aliments à privilégier</label><textarea name="alimentsPrioriser"></textarea></div><div><label>Aliments à éviter</label><textarea name="alimentsEviter"></textarea></div><div class="full"><label>Allergies, intolérances ou contraintes alimentaires</label><textarea name="allergies"></textarea></div></div></fieldset><fieldset><legend>Lieu et cuisine</legend><div class="grid"><div class="full"><label>Adresse *</label><input name="adresse" required></div><div><label>Code postal *</label><input name="codePostal" required></div><div><label>Ville *</label><input name="ville" required></div><div class="full"><label>Équipements disponibles</label><div class="choices"><label class="choice"><input type="checkbox" name="equipements" value="Four"> Four</label><label class="choice"><input type="checkbox" name="equipements" value="Plaques"> Plaques</label><label class="choice"><input type="checkbox" name="equipements" value="Micro-ondes"> Micro-ondes</label><label class="choice"><input type="checkbox" name="equipements" value="Réfrigérateur"> Réfrigérateur</label><label class="choice"><input type="checkbox" name="equipements" value="Congélateur"> Congélateur</label><label class="choice"><input type="checkbox" name="equipements" value="Lave-vaisselle"> Lave-vaisselle</label><label class="choice"><input type="checkbox" name="equipements" value="Autre"> Autre</label><label class="choice"><input type="checkbox" name="equipements" value="Je ne sais pas"> Je ne sais pas</label></div></div><div class="full"><label>Informations complémentaires sur la cuisine</label><textarea name="infosCuisine"></textarea></div></div></fieldset><fieldset><legend>Budget et coordonnées</legend><div class="grid"><div><label>Budget indicatif *</label><input name="budget" required></div><div><label>Prénom *</label><input name="prenom" required></div><div><label>Nom *</label><input name="nom" required></div><div><label>Téléphone *</label><input name="telephone" required></div><div><label>E-mail *</label><input name="email" type="email" required></div><div class="full"><label>Informations complémentaires</label><textarea name="infosComplementaires"></textarea></div></div></fieldset><div class="honeypot"><input name="website" tabindex="-1" autocomplete="off"></div><label class="check"><input name="confirmation" type="checkbox" required> Je confirme avoir vérifié les informations saisies. Demande sans engagement. *</label><div data-demande-status class="status" hidden></div><p><button class="btn btn-primary" type="submit">Envoyer ma demande</button></p></form></div></main><script src="../js/config.js"></script><script src="../js/demandes.js"></script></body></html>
